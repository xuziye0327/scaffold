fail_fast: true

repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: rustfmt --config skip_children=true
        language: system
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)\.cargo/config(\.toml)?$)'
