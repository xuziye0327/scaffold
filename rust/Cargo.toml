[workspace]
resolver = "3"
members = ["apps/my-app-cli", "crates/my-app-crate"]

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.85"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
