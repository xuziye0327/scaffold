repos:
  - repo: local
    hooks:
      - id: ty-check
        name: ty type check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        files: '(\.pyi?$|(^|/)(pyproject\.toml|uv\.lock)$)'

      - id: ruff-check
        name: ruff lint
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]
